<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名場面・連続再生プレイヤー（テスト版）</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 20px auto; padding: 0 15px; background: #f4f4f9; }
  .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 8px; }
  .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .controls { display: flex; gap: 10px; margin: 15px 0; justify-content: center; flex-wrap: wrap; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; border: none; border-radius: 6px; background: #e60012; color: white; font-weight: bold; }
  button:hover { opacity: 0.85; }
  button.sub { background: #555; }
  .clip-list { list-style: none; padding: 0; }
  .clip-item { background: white; padding: 12px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; border-left: 5px solid #ccc; display: flex; justify-content: space-between; }
  .clip-item.active { border-left-color: #e60012; background: #fff5f5; font-weight: bold; }
</style>
</head>
<body>

  <h2>🎬 名場面・連続再生プレイヤー（テスト版）</h2>
  
  <div class="video-wrapper">
    <div id="player"></div>
  </div>

  <div class="controls">
    <button class="sub" onclick="prevClip()">◀ 前のシーン</button>
    <button onclick="startPlaylist()">▶ 最初から連続再生</button>
    <button class="sub" onclick="replayClip()">🔁 もう1回</button>
    <button class="sub" onclick="nextClip()">次のシーン ▶</button>
  </div>

  <p id="now-playing" style="text-align:center; font-weight:bold; color:#e60012;">プレイヤー準備中...</p>

  <ul class="clip-list" id="clip-list"></ul>

<script>
  const playlist = [
    { videoId: "M7lc1UVf-VE", start: 10, end: 16, title: "シーン1：神プレイの瞬間（0:10〜0:16）" },
    { videoId: "M7lc1UVf-VE", start: 30, end: 36, title: "シーン2：ぼんさん絶叫シーン（0:30〜0:36）" },
    { videoId: "M7lc1UVf-VE", start: 50, end: 55, title: "シーン3：全員大爆笑のオチ（0:50〜0:55）" }
  ];

  let player = null;
  let currentIndex = 0;
  let isPlayingList = false;

  // APIが読み込まれたら自動で呼ばれる
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: playlist[0].videoId, // ← ここを[0]に修正済み
      playerVars: {
        'playsinline': 1,
        'rel': 0,
        'origin': window.location.origin
      },
      events: {
        'onReady': onPlayerReady,
        'onStateChange': onPlayerStateChange
      }
    });
    renderList();
  }

  // プレイヤーの操作準備が完全に整ったら呼ばれる
  function onPlayerReady(event) {
    document.getElementById('now-playing').innerText = "準備完了！「最初から連続再生」を押してください";
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED && isPlayingList) {
      if (currentIndex + 1 < playlist.length) {
        currentIndex++;
        playClip(currentIndex);
      } else {
        document.getElementById('now-playing').innerText = "🎉 すべての名場面の再生が終了しました！";
        isPlayingList = false;
      }
    }
  }

  function playClip(index) {
    if (!player || typeof player.loadVideoById !== 'function') {
      alert("プレイヤーの読み込み中です。数秒待ってから押してください！");
      return;
    }
    currentIndex = index;
    isPlayingList = true;
    const clip = playlist[index];
    
    player.loadVideoById({
      videoId: clip.videoId,
      startSeconds: clip.start,
      endSeconds: clip.end
    });

    document.getElementById('now-playing').innerText = "再生中：" + clip.title;
    renderList();
  }

  function startPlaylist() { playClip(0); }
  function replayClip() { playClip(currentIndex); }
  function nextClip() { if (currentIndex + 1 < playlist.length) playClip(currentIndex + 1); }
  function prevClip() { if (currentIndex - 1 >= 0) playClip(currentIndex - 1); }

  function renderList() {
    const listEl = document.getElementById('clip-list');
    listEl.innerHTML = "";
    playlist.forEach((clip, idx) => {
      const li = document.createElement('li');
      li.className = "clip-item" + (idx === currentIndex ? " active" : "");
      li.innerHTML = `<span>${idx + 1}. ${clip.title}</span><span>▶</span>`;
      li.onclick = () => playClip(idx);
      listEl.appendChild(li);
    });
  }
</script>

<!-- YouTube IFrame API を確実に読み込むタグ -->
<script src="https://youtube.com"></script>

</body>
</html>
