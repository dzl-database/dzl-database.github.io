<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ドズル社切り抜きメーカー</title>

<meta name="description" content="ドズル社の名場面や切り抜きをまとめた非公式ファンサイトです。">

<!-- Material Icons -->
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<style>

/* =========================
   FONT
========================= */

@font-face {
  font-family: "LINE Seed JP";
  src: url("./fonts/LINESeedJP_OTF_Rg.woff2") format("woff2");
  font-weight: 400;
}

@font-face {
  font-family: "LINE Seed JP";
  src: url("./fonts/LINESeedJP_OTF_Bd.woff2") format("woff2");
  font-weight: 700;
}

/* =========================
   BASE
========================= */

:root {

  --main: #e60012;
  --main-light: #fff0f1;

  --bg: #f7f7f9;
  --white: #ffffff;

  --text: #222222;
  --sub: #777777;

  --border: #eeeeee;

  --radius: 14px;

}

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    "LINE Seed JP",
    sans-serif;

  background: var(--bg);

  color: var(--text);

}

button {
  font-family: inherit;
  cursor: pointer;
}

.material-symbols-outlined {
  font-size: 22px;
  vertical-align: middle;
}

/* =========================
   HEADER
========================= */

header {

  height: 68px;

  background: white;

  border-bottom: 1px solid var(--border);

  position: sticky;

  top: 0;

  z-index: 100;

}

.header-inner {

  max-width: 1100px;

  height: 100%;

  margin: auto;

  padding: 0 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

}

.logo {

  font-size: 19px;

  font-weight: bold;

  color: var(--main);

  cursor: pointer;

}

.header-nav {

  display: flex;

  gap: 22px;

}

.header-nav a {

  color: var(--text);

  text-decoration: none;

  font-size: 13px;

  font-weight: bold;

}

.header-nav a:hover {
  color: var(--main);
}

/* =========================
   LAYOUT
========================= */

.container {

  max-width: 1100px;

  margin: auto;

  padding: 35px 20px;

}

.page-title {

  font-size: 26px;

  font-weight: bold;

  margin: 0 0 8px;

}

.page-description {

  color: var(--sub);

  font-size: 13px;

  line-height: 1.8;

}

/* =========================
   HERO
========================= */

.hero {

  background: white;

  border-radius: 18px;

  padding: 35px;

  margin-bottom: 35px;

  border: 1px solid var(--border);

}

.hero-label {

  color: var(--main);

  font-size: 12px;

  font-weight: bold;

  margin-bottom: 10px;

}

.hero h1 {

  font-size: 28px;

  margin: 0 0 12px;

}

.hero p {

  color: var(--sub);

  font-size: 14px;

  line-height: 1.8;

  margin: 0;

}

/* =========================
   PLAYLIST GRID
========================= */

.section-heading {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 20px;

}

.section-heading h2 {

  font-size: 20px;

  margin: 0;

}

.playlist-grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 20px;

}

.playlist-card {

  background: white;

  border-radius: var(--radius);

  overflow: hidden;

  border: 1px solid var(--border);

  cursor: pointer;

  transition: .2s;

}

.playlist-card:hover {

  transform: translateY(-4px);

  box-shadow: 0 8px 25px rgba(0,0,0,.06);

}

.card-thumbnail {

  width: 100%;

  aspect-ratio: 16 / 9;

  object-fit: cover;

  background: #eeeeee;

  display: block;

}

.card-content {

  padding: 16px;

}

.card-title {

  font-size: 15px;

  font-weight: bold;

  margin-bottom: 8px;

}

.card-description {

  font-size: 12px;

  color: var(--sub);

  line-height: 1.7;

  height: 40px;

  overflow: hidden;

}

.card-meta {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-top: 14px;

  font-size: 11px;

  color: var(--sub);

}

.card-like {

  color: var(--main);

  display: flex;

  gap: 4px;

  align-items: center;

}

/* =========================
   DETAIL
========================= */

.detail-header {

  margin-bottom: 25px;

}

.back-button {

  display: inline-flex;

  align-items: center;

  gap: 5px;

  border: none;

  background: none;

  color: var(--sub);

  font-size: 13px;

  padding: 0;

  margin-bottom: 20px;

}

.detail-title {

  font-size: 25px;

  margin: 0 0 10px;

}

.detail-description {

  font-size: 13px;

  color: var(--sub);

  line-height: 1.8;

}

.player-section {

  background: white;

  padding: 18px;

  border-radius: var(--radius);

  border: 1px solid var(--border);

}

.video-wrapper {

  position: relative;

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

  padding-bottom: 42.75%;

  background: black;

  border-radius: 10px;

  overflow: hidden;

}

.video-wrapper iframe {

  position: absolute;

  width: 100%;

  height: 100%;

  border: none;

  top: 0;

  left: 0;

}

.player-placeholder {

  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 12px;

  background: #171717;

  color: white;

  z-index: 2;

  text-align: center;

  padding: 20px;

}

.player-placeholder button {

  background: var(--main);

  border: none;

  color: white;

  padding: 13px 25px;

  border-radius: 8px;

  font-weight: bold;

}

.now-playing {

  text-align: center;

  font-size: 13px;

  color: var(--main);

  font-weight: bold;

  margin: 18px 0;

}

.player-controls {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 10px;

  flex-wrap: wrap;

}

.control-button {

  border: none;

  background: #f2f2f2;

  padding: 11px 17px;

  border-radius: 8px;

  font-size: 13px;

  font-weight: bold;

  display: flex;

  align-items: center;

  gap: 5px;

}

.control-button.primary {

  background: var(--main);

  color: white;

}

.control-button:hover {
  opacity: .8;
}

/* =========================
   VIDEO LIST
========================= */

.video-list-section {

  margin-top: 25px;

  background: white;

  padding: 20px;

  border-radius: var(--radius);

  border: 1px solid var(--border);

}

.video-list-section h3 {

  font-size: 16px;

  margin: 0 0 15px;

}

.video-list {

  display: flex;

  flex-direction: column;

  gap: 8px;

}

.video-item {

  display: flex;

  align-items: center;

  gap: 13px;

  padding: 13px;

  border-radius: 8px;

  background: #fafafa;

  cursor: pointer;

  border: 1px solid transparent;

}

.video-item:hover {
  background: #f5f5f5;
}

.video-item.active {

  background: var(--main-light);

  border-color: #ffd5d8;

}

.video-number {

  width: 28px;

  height: 28px;

  border-radius: 7px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #eeeeee;

  font-size: 12px;

  font-weight: bold;

  flex-shrink: 0;

}

.video-item.active .video-number {

  background: var(--main);

  color: white;

}

.video-item-title {

  font-size: 13px;

  font-weight: bold;

  flex: 1;

}

.video-play-icon {

  color: var(--main);

}

/* =========================
   LIKE
========================= */

.like-section {

  margin-top: 20px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: white;

  padding: 18px;

  border-radius: var(--radius);

  border: 1px solid var(--border);

}

.like-section p {

  font-size: 13px;

  margin: 0;

  font-weight: bold;

}

.like-button {

  display: flex;

  align-items: center;

  gap: 7px;

  background: var(--main-light);

  color: var(--main);

  border: none;

  border-radius: 30px;

  padding: 10px 20px;

  font-weight: bold;

}

.like-button.liked {

  background: var(--main);

  color: white;

}

.like-button:disabled {

  opacity: .5;

  cursor: not-allowed;

}

/* =========================
   PAGES
========================= */

.info-page {

  background: white;

  padding: 30px;

  border-radius: var(--radius);

  line-height: 2;

}

.info-page h2 {

  font-size: 20px;

  margin-top: 25px;

}

.info-page p {

  font-size: 14px;

  color: var(--sub);

}

/* =========================
   EMPTY / LOADING
========================= */

.message {

  padding: 60px 20px;

  text-align: center;

  color: var(--sub);

  font-size: 14px;

  grid-column: 1 / -1;

}

.loading {

  text-align: center;

  padding: 60px;

  color: var(--sub);

}

/* =========================
   FOOTER
========================= */

footer {

  background: white;

  border-top: 1px solid var(--border);

  padding: 35px 20px;

  text-align: center;

  margin-top: 60px;

}

.footer-logo {

  color: var(--main);

  font-weight: bold;

  font-size: 17px;

}

.footer-links {

  display: flex;

  justify-content: center;

  gap: 20px;

  margin: 18px 0;

  flex-wrap: wrap;

}

.footer-links a {

  color: var(--sub);

  text-decoration: none;

  font-size: 12px;

}

.copyright {

  color: #aaaaaa;

  font-size: 11px;

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

  .playlist-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media(max-width: 550px) {

  header {
    height: 60px;
  }

  .header-inner {
    padding: 0 15px;
  }

  .logo {
    font-size: 15px;
  }

  .header-nav {
    gap: 12px;
  }

  .header-nav a {
    font-size: 11px;
  }

  .container {
    padding: 25px 15px;
  }

  .hero {
    padding: 23px;
  }

  .hero h1 {
    font-size: 22px;
  }

  .playlist-grid {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .playlist-card {
    display: flex;
  }

  .card-thumbnail {
    width: 125px;
    height: 100px;
    aspect-ratio: auto;
  }

  .card-content {
    flex: 1;
    padding: 12px;
    min-width: 0;
  }

  .card-title {
    font-size: 13px;
  }

  .card-description {
    font-size: 11px;
    height: 34px;
  }

  .detail-title {
    font-size: 21px;
  }

  .player-section {
    padding: 10px;
  }

  .control-button {
    padding: 10px 12px;
    font-size: 11px;
  }

  .info-page {
    padding: 20px;
  }

}

@media(max-width: 550px) {

  .video-wrapper {

    max-width: 100%;

    padding-bottom: 56.25%;

  }

}

</style>

<!-- HEADER -->

<header>

  <div class="header-inner">

    <div class="logo" onclick="goHome()">
      ドズル社切り抜きメーカー
    </div>

    <nav class="header-nav">

      <a href="#" onclick="goHome();return false;">
        ホーム
      </a>

      <a href="#howto">
        使い方
      </a>

      <a href="#rule">
        投稿ルール
      </a>

    </nav>

  </div>

</header>


<!-- MAIN -->

<main class="container">

  <div id="app">

    <div class="loading">
      読み込み中...
    </div>

  </div>

</main>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    ドズル社切り抜きメーカー
  </div>

  <div class="footer-links">

    <a href="#" onclick="goHome();return false;">
      ホーム
    </a>

    <a href="#about">
      サイトについて
    </a>

    <a href="#howto">
      使い方
    </a>

    <a href="#rule">

    </a>

  </div>

    ドズル社および関係者とは一切関係ありません。
  </div>

</footer>


<script>

/* =================================
   CONFIG
================================= */

// GoogleスプレッドシートのCSV公開URL
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHHGOHXh7eD2sl2cnxZ3I0m-MBYGleg2aiF7r32gOJhx6JeHR6aWfcTXUj-3QsXLVm7pSNcBnTYwFo/pub?gid=0&single=true&output=csv";

// GASのウェブアプリURL
const GAS_URL = "https://script.google.com/macros/s/AKfycbxrHQkQ0GINUmVvdfWeBbggJJsLHIPdhf-rXsrJ00cRdhAC4k4LdX03PxQE5vDE0x0b3Q/exec";

// YouTube API
const YOUTUBE_API =
  "https://www.youtube.com/iframe_api";


/* =================================
   GLOBAL
================================= */

let playlists = [];

let currentPlaylist = null;

let currentIndex = 0;

let player = null;

let playerReady = false;

let isPlayingList = false;

let playerInitialized = false;

let isAdvancing = false;

let playerInstanceReady = false;


/* =================================
   CSV PARSER
================================= */

function parseCSV(text) {

  const rows = [];

  let row = [];

  let value = "";

  let insideQuote = false;

  for (let i = 0; i < text.length; i++) {

    const char = text[i];

    if (char === '"') {

      if (
        insideQuote &&
        text[i + 1] === '"'
      ) {

        value += '"';

        i++;

      } else {

        insideQuote = !insideQuote;

      }

    } else if (char === "," && !insideQuote) {

      row.push(value);

      value = "";

    } else if (
      (char === "\n" || char === "\r") &&
      !insideQuote
    ) {

      if (char === "\r" && text[i + 1] === "\n") {
        i++;
      }

      row.push(value);

      if (row.some(v => v !== "")) {
        rows.push(row);
      }

      row = [];

      value = "";

    } else {

      value += char;

    }

  }

  row.push(value);

  if (row.some(v => v !== "")) {
    rows.push(row);
  }

  return rows;

}


/* =================================
   LOAD PLAYLISTS
================================= */

async function loadPlaylists() {

  try {

    const response = await fetch(CSV_URL);

    if (!response.ok) {
      throw new Error("CSV読み込み失敗");
    }

    const text = await response.text();

    const rows = parseCSV(text);

    const headers = rows.shift();

    playlists = rows.map(row => {

      const data = {};

      headers.forEach((header, index) => {

        data[header.trim()] =
          row[index] || "";

      });

      let videos = [];

      try {

        videos = JSON.parse(
          data.videos_json || "[]"
        );

      } catch(e) {

        console.error("JSONエラー", data.id);

      }

      return {

        id: data.id,

        title: data.title,

        description: data.description,

        creator: data.creator,

        thumbnail: data.thumbnail,

        videos: videos,

        likes: Number(data.likes) || 0,

        published: data.published,

        category: data.category,

        created_at: data.created_at

      };

    }).filter(item => {

      return (
        item.id &&
        String(item.published).toUpperCase() === "TRUE"
      );

    });

    renderPage();

  } catch(error) {

    console.error(error);

    document.getElementById("app").innerHTML = `
      <div class="message">
        プレイリストを読み込めませんでした。<br>
        CSVのURLや公開設定を確認してください。
      </div>
    `;

  }

}


/* =================================
   ROUTING
================================= */

function renderPage() {

  const params = new URLSearchParams(
    location.search
  );

  const id = params.get("id");

  if (id) {

    renderDetail(id);

    return;

  }

  switch(location.hash) {

    case "#rule":
      renderRule();
      break;

    case "#howto":
      renderHowto();
      break;

    case "#about":
      renderAbout();
      break;

    default:
      renderHome();

  }

}

window.addEventListener("hashchange", renderPage);

window.addEventListener("popstate", renderPage);


function goHome() {

  history.pushState({}, "", location.pathname);

  renderPage();

  window.scrollTo(0, 0);

}


/* =================================
   HOME
================================= */

function renderHome() {

  currentPlaylist = null;

  const app = document.getElementById("app");

  app.innerHTML = `

    <section class="hero">

      <div class="hero-label">
        UNOFFICIAL FAN SITE
      </div>

      <h1>
        ドズル社の名場面を、<br>
        もっと楽しもう。
      </h1>

      <p>
        お気に入りのシーンをまとめたプレイリストを公開中。<br>
        みんなでドズル社の魅力を楽しもう。
      </p>

    </section>


    <div class="section-heading">

      <h2>
        プレイリスト一覧
      </h2>

      <span style="font-size:12px;color:#999;">
        ${playlists.length}件
      </span>

    </div>


    <div class="playlist-grid" id="playlist-grid">

    </div>

  `;

  const grid = document.getElementById(
    "playlist-grid"
  );

  if (playlists.length === 0) {

    grid.innerHTML = `
      <div class="message">
        公開中のプレイリストはありません。
      </div>
    `;

    return;

  }

  playlists.forEach(item => {

    const card = document.createElement("article");

    card.className = "playlist-card";

    card.addEventListener("click", () => {

      openPlaylist(item.id);

    });

    const thumbnail = document.createElement("img");

    thumbnail.className = "card-thumbnail";

    thumbnail.src = item.thumbnail ||
      "https://placehold.co/640x360?text=Playlist";

    thumbnail.alt = item.title;

    thumbnail.loading = "lazy";

    const content = document.createElement("div");

    content.className = "card-content";

    const title = document.createElement("div");

    title.className = "card-title";

    title.textContent = item.title;

    const description = document.createElement("div");

    description.className = "card-description";

    description.textContent = item.description;

    const meta = document.createElement("div");

    meta.className = "card-meta";

    const creator = document.createElement("span");

    creator.textContent = item.creator || "管理人";

    const likes = document.createElement("span");

    likes.className = "card-like";

    likes.innerHTML = `
      <span class="material-symbols-outlined">
        favorite
      </span>
      ${item.likes}
    `;

    meta.append(creator, likes);

    content.append(title, description, meta);

    card.append(thumbnail, content);

    grid.appendChild(card);

  });

}


/* =================================
   OPEN DETAIL
================================= */

function openPlaylist(id) {

  history.pushState(
    {},
    "",
    "?id=" + encodeURIComponent(id)
  );

  renderDetail(id);

  window.scrollTo(0, 0);

}


/* =================================
   DETAIL
================================= */

function renderDetail(id) {

  const item = playlists.find(p => {
    return String(p.id) === String(id);
  });

  const app = document.getElementById("app");

  if (!item) {

    app.innerHTML = `
      <div class="message">
        プレイリストが見つかりませんでした。
        <br><br>
        <button class="control-button"
        onclick="goHome()">
          トップページへ戻る
        </button>
      </div>
    `;

    return;

  }

  currentPlaylist = item;

  currentIndex = 0;

  isPlayingList = false;

  app.innerHTML = `

    <section class="detail-header">

      <button class="back-button"
      onclick="goHome()">

        <span class="material-symbols-outlined">
          arrow_back
        </span>

        一覧に戻る

      </button>

      <h1 class="detail-title">
        ${escapeHTML(item.title)}
      </h1>

      <div class="detail-description">
        ${escapeHTML(item.description)}
      </div>

      <div style="font-size:12px;color:#999;margin-top:10px;">
        作成者：${escapeHTML(item.creator || "管理人")}
        ／ ${item.videos.length}本の動画
      </div>

    </section>


    <section class="player-section">

      <div class="video-wrapper">

        <div id="player"></div>

        <div class="player-placeholder"
        id="player-placeholder">

          <span class="material-symbols-outlined"
          style="font-size:48px;">
            play_circle
          </span>

          <div>
            動画を再生するにはボタンを押してください。
          </div>

          <button onclick="initializePlayer()">
            再生する
          </button>

        </div>

      </div>


      <div class="now-playing"
      id="now-playing">

        動画を選択してください

      </div>


      <div class="player-controls">

        <button class="control-button"
        onclick="prevClip()">

          <span class="material-symbols-outlined">
            skip_previous
          </span>

          前へ

        </button>


        <button class="control-button primary"
        onclick="startPlaylist()">

          <span class="material-symbols-outlined">
            play_arrow
          </span>

          最初から再生

        </button>


        <button class="control-button"
        onclick="replayClip()">

          <span class="material-symbols-outlined">
            replay
          </span>

          リピート

        </button>


        <button class="control-button"
        onclick="nextClip()">

          次へ

          <span class="material-symbols-outlined">
            skip_next
          </span>

        </button>

      </div>

    </section>


    <section class="video-list-section">

      <h3>
        プレイリスト
      </h3>

      <div class="video-list"
      id="video-list">

      </div>

    </section>


    <section class="like-section">

      <p>
        このプレイリストが気に入ったら
      </p>

      <button class="like-button"
      id="like-button"
      onclick="sendLike()">

        <span class="material-symbols-outlined">
          favorite
        </span>

        <span id="like-count">
          ${item.likes}
        </span>

      </button>

    </section>

  `;

  playerInitialized = false;

  renderVideoList();

  updateNowPlaying();

  updateLikeButton();

}


/* =================================
   HTML ESCAPE
================================= */

function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]
  );

}


/* =================================
   VIDEO LIST
================================= */

function renderVideoList() {

  const list = document.getElementById(
    "video-list"
  );

  if (!list || !currentPlaylist) return;

  list.innerHTML = "";

  currentPlaylist.videos.forEach((video, index) => {

    const item = document.createElement("div");

    item.className =
      "video-item" +
      (index === currentIndex ? " active" : "");

    const number = document.createElement("div");

    number.className = "video-number";

    number.textContent = index + 1;

    const title = document.createElement("div");

    title.className = "video-item-title";

    title.textContent = video.title ||
      "動画 " + (index + 1);

    const icon = document.createElement("span");

    icon.className =
      "material-symbols-outlined video-play-icon";

    icon.textContent = "play_circle";

    item.append(number, title, icon);

    item.addEventListener("click", () => {

      playClip(index);

    });

    list.appendChild(item);

  });

}


/* =================================

================================= */

window.onYouTubeIframeAPIReady = function() {

  playerReady = true;

/* =================================
   INITIALIZE PLAYER
================================= */

function initializePlayer() {

  if (!currentPlaylist) return;

  if (!playerReady) {

    alert("プレイヤーを準備しています。少し待ってください。");

    return;

  }

  if (playerInitialized && player) {

    playClip(0);

    return;

  }

  if (!currentPlaylist.videos.length) {

    alert("動画が登録されていません。");

    return;

  }

  playerInitialized = true;

  const first = currentPlaylist.videos[0];

  player = new YT.Player("player", {

    // 最初の動画はonReadyで一度だけ読み込む

    playerVars: {
      playsinline: 1,
      rel: 0,
      enablejsapi: 1,
      origin: window.location.origin
    },

    events: {

      onReady: function() {

        playerInstanceReady = true;

        document.getElementById(
          "player-placeholder"
        ).style.display = "none";

        // 最初の動画を一度だけ再生
        playClip(0);

      },

      onStateChange: onPlayerStateChange

    }

  });

}


/* =================================
   PLAYER STATE
================================= */

function onPlayerStateChange(event) {

  // 次の動画の再生が始まったらロック解除
  if (event.data === YT.PlayerState.PLAYING) {

    isAdvancing = false;

    return;

  }

  if (
    event.data === YT.PlayerState.ENDED &&
    isPlayingList &&
    !isAdvancing
  ) {

    // 重複した終了イベントを防ぐ
    isAdvancing = true;

    if (
      currentIndex + 1 <
      currentPlaylist.videos.length
    ) {

      playClip(currentIndex + 1);

    } else {

      isPlayingList = false;

      isAdvancing = false;

      document.getElementById(
        "now-playing"
      ).textContent =
        "すべての動画の再生が終了しました。";

    }

  }

}


/* =================================
   PLAY VIDEO
================================= */

function playClip(index) {

  if (!currentPlaylist) return;

  if (
    index < 0 ||
    index >= currentPlaylist.videos.length
  ) return;

  if (!playerInitialized) {

    initializePlayer();

    return;

  }

  if (!player || !playerReady || !playerInstanceReady) return;

  if (player.getPlayerState() === -1 &&
      !player.getVideoData().video_id) {
    return;
  }

  currentIndex = index;

  isPlayingList = true;

  const clip = currentPlaylist.videos[index];

  player.loadVideoById({

    videoId: clip.videoId,

    startSeconds: Number(clip.start) || 0,

    endSeconds: Number(clip.end) || undefined

  });

  updateNowPlaying();

  renderVideoList();

}


/* =================================
   CONTROLS
================================= */

function startPlaylist() {

  playClip(0);

}

function nextClip() {

  if (
    currentIndex + 1 <
    currentPlaylist.videos.length
  ) {

    playClip(currentIndex + 1);

  }

}

function prevClip() {

  if (currentIndex > 0) {

    playClip(currentIndex - 1);

  }

}

function replayClip() {

  if (!currentPlaylist) return;

  playClip(currentIndex);

}


/* =================================
   NOW PLAYING
================================= */

function updateNowPlaying() {

  const element = document.getElementById(
    "now-playing"
  );

  if (!element || !currentPlaylist) return;

  const clip = currentPlaylist.videos[currentIndex];

  if (!clip) return;

  element.textContent =
    "再生中：" + (clip.title || "動画 " + (currentIndex + 1));

}


/* =================================
   LIKE SYSTEM
================================= */

function updateLikeButton() {

  if (!currentPlaylist) return;

  const button = document.getElementById(
    "like-button"
  );

  const count = document.getElementById(
    "like-count"
  );

  if (!button || !count) return;

  count.textContent = currentPlaylist.likes;

  const liked = localStorage.getItem(
    "liked_" + currentPlaylist.id
  );

  if (liked) {

    button.classList.add("liked");

    button.disabled = true;

  }

}


function sendLike() {

  if (!currentPlaylist) return;

  const id = currentPlaylist.id;

  const storageKey = "liked_" + id;

  if (localStorage.getItem(storageKey)) {

    return;

  }

  const button = document.getElementById(
    "like-button"
  );

  button.disabled = true;

  button.textContent = "送信中...";

  jsonpRequest(

    GAS_URL +
    "?action=like&id=" +
    encodeURIComponent(id),

    function(result) {

      if (result.success) {

        currentPlaylist.likes = result.likes;

        localStorage.setItem(
          storageKey,
          "true"
        );

        updateLikeButton();

      } else {

        button.disabled = false;

        alert("いいねに失敗しました。");

      }

    },

    function() {

      button.disabled = false;

      updateLikeButton();

      alert("通信エラーが発生しました。");

    }

  );

}


/* =================================
   JSONP
================================= */

function jsonpRequest(url, callback, errorCallback) {

  const callbackName =
    "jsonp_" + Date.now() +
    "_" + Math.random().toString(36).slice(2);

  const script = document.createElement("script");

  let finished = false;

  const timer = setTimeout(() => {

    finish();

    if (errorCallback) errorCallback();

  }, 15000);

  function finish() {

    if (finished) return;

    finished = true;

    clearTimeout(timer);

    delete window[callbackName];

    script.remove();

  }

  window[callbackName] = function(data) {

    finish();

    callback(data);

  };

  script.src =
    url +
    "&callback=" +
    callbackName;

  script.onerror = function() {

    finish();

    if (errorCallback) errorCallback();

  };

  document.body.appendChild(script);

}
